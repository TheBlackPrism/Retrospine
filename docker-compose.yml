services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-retrospine}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-retrospine}
      POSTGRES_DB: ${POSTGRES_DB:-retrospine}
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-retrospine} -d ${POSTGRES_DB:-retrospine}",
        ]
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    build: .
    image: retrospine:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-retrospine}:${POSTGRES_PASSWORD:-retrospine}@db:5432/${POSTGRES_DB:-retrospine}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET in .env (openssl rand -base64 32)}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      GOOGLE_BOOKS_API_KEY: ${GOOGLE_BOOKS_API_KEY:-}
      GOOGLE_BOOKS_COUNTRY: ${GOOGLE_BOOKS_COUNTRY:-}
      AUTO_MIGRATE: ${AUTO_MIGRATE:-true}

volumes:
  db-data:
